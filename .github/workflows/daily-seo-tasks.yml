name: Daily SEO task checklist
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-seo-tasks.yml'
      - 'scripts/daily-seo-tasks.js'
permissions:
  contents: read
  id-token: write
concurrency:
  group: daily-seo-task-checklist
  cancel-in-progress: false
jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --include=dev --package-lock=false
      - name: Authenticate read-only Search Console access
        id: gsc-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/726465456292/locations/global/workloadIdentityPools/github-pool-2/providers/github-provide
          service_account: gsc-reader@terminaljetaime.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Audit, prioritize tasks and send Telegram checklist
        run: node scripts/daily-seo-tasks.js
        env:
          GSC_ACCESS_TOKEN: ${{ steps.gsc-auth.outputs.access_token }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:terminaljetaime.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-seo-tasks
          path: |
            reports/*-daily-seo-tasks.txt
            reports/*-weekly-seo.json
          retention-days: 30
