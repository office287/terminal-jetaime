name: Weekly SEO progress report
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-seo.yml'
      - 'scripts/weekly-seo.js'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --include=dev --package-lock=false
      - name: Compare performance and send report
        run: node scripts/weekly-seo.js
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-seo-report
          path: reports/*-weekly-seo.*
          retention-days: 90
