name: Weekly SEO progress report
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-seo.yml'
      - 'scripts/weekly-seo.js'
permissions:
  contents: read
  id-token: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --include=dev --package-lock=false
      - name: Authenticate read-only Search Console access
        id: gsc-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/726465456292/locations/global/workloadIdentityPools/github-pool-2/providers/github-provide
          service_account: gsc-reader@terminaljetaime.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Compare performance and send report
        run: node scripts/weekly-seo.js
        env:
          GSC_ACCESS_TOKEN: ${{ steps.gsc-auth.outputs.access_token }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:terminaljetaime.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-seo-report
          path: reports/*-weekly-seo.*
          retention-days: 90
